services:
  triton:
    image: nvcr.io/nvidia/tritoninferenceserver:24.01-py3
    command: tritonserver --model-repository=/models
    volumes:
      - ./triton_model_repo:/models
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  pii-proxy:
    build: .
    environment:
      TRITON_URL: "triton:8001"
      LLM_BASE_URL: "http://llm-server:8000/v1"
      VAULT_TTL: "3600"
    ports:
      - "9000:9000"
    depends_on:
      - triton

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
